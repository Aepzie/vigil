version: 2

project_name: vigil

before:
  hooks:
    - go mod tidy -diff
    - go mod download

builds:
  - id: vigil
    main: ./cmd/vigil
    binary: vigil
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -buildid= -X main.version=v{{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, windows]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ignore:
      - goos: windows
        goarch: arm

archives:
  - id: vigil
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}
    files:
      - LICENSE
      - README.md
      - SECURITY.md
      - contrib/systemd/vigil.service

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"
  prefix_template: "{{ .ProjectName }}-{{ .Version }}/"
  format: tar.gz

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^ci"
      - "^chore"
      - "^Merge "
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Other
      order: 999

release:
  github:
    owner: Aepzie
    name: vigil
  name_template: "vigil v{{ .Version }}"
  footer: |
    ## Verify the download

    ```bash
    sha256sum --ignore-missing -c vigil_{{ .Version }}_checksums.txt
    ```

    On Windows (PowerShell):

    ```powershell
    Get-FileHash .\vigil_{{ .Version }}_windows_amd64.zip -Algorithm SHA256
    ```

    and compare with the matching line in `vigil_{{ .Version }}_checksums.txt`.
